build_from:
  armhf: ghcr.io/home-assistant/armhf-base-python:latest
  armv7: ghcr.io/home-assistant/armv7-base-python:latest
  aarch64: ghcr.io/home-assistant/aarch64-base-python:latest
  amd64: ghcr.io/home-assistant/amd64-base-python:latest
labels:
  org.opencontainers.image.title: "CyncLAN Bridge - Home Assistant App"
  org.opencontainers.image.description: "Local MQTT controller for Cync/C by GE smart devices (DNS redirection required)"
  # image.source is what attaches a published package to a repository in the
  # GitHub Packages UI. This pointed at baudneo/hass-addons - the upstream this
  # was forked from - so the built add-on image was being filed under somebody
  # else's repo. Same bug, same fix as the one already corrected in the
  # cync-lan repository's own docker/Dockerfile.
  org.opencontainers.image.source: "https://github.com/Proxy-alt/hass-addons"
  org.opencontainers.image.licenses: "MIT"
