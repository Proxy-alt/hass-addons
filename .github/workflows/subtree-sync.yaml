name: Sync cync-lan subtree

# Keeps cync-lan/upstream/ (a git subtree of Proxy-alt/cync-lan's python
# branch, see RELEASING.md in that repository) in step with upstream, and keeps
# three things that must never disagree moving together:
#
#   * cync-lan/CHANGELOG.md          - copied from upstream's
#   * cync-lan/config.yaml `version` - what Home Assistant offers as an update
#   * the cync-lan-mqtt pin in       - what actually gets installed
#     cync-lan/Dockerfile
#
# The version and the pin drifting apart is not cosmetic: config.yaml is what
# prompts a user to update, and the pin is what they receive. If only the first
# moves, people are offered a "new version" that installs the old code.
#
# This pushes straight to dev rather than opening a pull request. An earlier
# version opened one, which requires "Allow GitHub Actions to create and
# approve pull requests" - and with that setting off the subtree pull and the
# branch push both succeeded while only the final step failed, leaving the work
# stranded on an orphan branch with nothing pointing at it. That is exactly how
# the 2026-07-27 run failed, and how the add-on came to sit on 0.0.6b45 while
# upstream was at 0.2.2. A sync that silently strands its own output is worse
# than no sync, so the PR step is gone.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subtree-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull the cync-lan python branch into cync-lan/upstream
        run: |
          git subtree pull --prefix=cync-lan/upstream \
            https://github.com/Proxy-alt/cync-lan.git python --squash \
            -m "Subtree-sync: pull cync-lan python branch"

      - name: Copy the canonical CHANGELOG.md over the add-on's own copy
        run: |
          if ! cmp -s cync-lan/upstream/CHANGELOG.md cync-lan/CHANGELOG.md; then
            cp cync-lan/upstream/CHANGELOG.md cync-lan/CHANGELOG.md
            git add cync-lan/CHANGELOG.md
            git commit -m "Sync cync-lan/CHANGELOG.md from upstream"
          fi

      - name: Move the add-on version and the install pin together
        run: |
          python3 - <<'PY'
          import re, sys, tomllib

          with open("cync-lan/upstream/pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          # Targeted line rewrites, not YAML/Dockerfile round-trips: re-emitting
          # config.yaml would discard its comments and reorder its keys.
          edits = [
              ("cync-lan/config.yaml",
               r'^(version:[ \t]*)"[^"]*"', rf'\g<1>"{version}"', re.M),
              ("cync-lan/Dockerfile",
               r'"cync-lan-mqtt==[^"]*"', f'"cync-lan-mqtt=={version}"', 0),
          ]
          changed = False
          for path, pattern, repl, flags in edits:
              src = open(path).read()
              new, count = re.subn(pattern, repl, src, count=1, flags=flags)
              # Assert rather than pass silently: if a refactor moves either
              # line, the sync must fail loudly instead of quietly shipping a
              # version and a pin that disagree.
              if count != 1:
                  sys.exit(f"expected exactly one match in {path}, found {count}")
              if new != src:
                  open(path, "w").write(new)
                  changed = True
          print(f"{'updated to' if changed else 'already at'} {version}")
          PY

          if ! git diff --quiet cync-lan/config.yaml cync-lan/Dockerfile; then
            git add cync-lan/config.yaml cync-lan/Dockerfile
            git commit -m "Bump add-on version and install pin to match upstream"
          fi

      # The export UI is built from the subtree rather than committed upstream,
      # so it has to be rebuilt here whenever web/ changes. It is committed to
      # this repository on purpose: with no `image:` key in config.yaml the
      # Supervisor builds the add-on on the user's own machine, and making a
      # Raspberry Pi run `npm ci` on every update would be a bad trade for
      # avoiding three checked-in files.
      - name: Rebuild the export UI if it changed
        run: |
          if git diff --quiet HEAD~1 -- cync-lan/upstream/web 2>/dev/null; then
            echo "web/ unchanged; leaving static/ alone"
            exit 0
          fi
          cd cync-lan/upstream/web
          npm ci --silent
          npm run build
          cd - >/dev/null
          rm -rf cync-lan/static
          mkdir -p cync-lan/static
          cp cync-lan/upstream/web/dist/index.html cync-lan/static/index.html
          cp cync-lan/upstream/web/dist/static/* cync-lan/static/
          if ! git diff --quiet cync-lan/static || [ -n "$(git status --porcelain cync-lan/static)" ]; then
            git add -A cync-lan/static
            git commit -m "Rebuild the add-on export UI from upstream web/"
          fi

      - name: Push
        run: git push origin HEAD:dev
