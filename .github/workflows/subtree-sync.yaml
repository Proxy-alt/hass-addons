name: Sync cync-lan subtree

# Keeps cync-lan/upstream/ (a git subtree of Proxy-alt/cync-lan's python
# branch, see RELEASING.md in that repository) up to date, and copies its
# CHANGELOG.md over cync-lan/CHANGELOG.md so the add-on's own changelog
# never drifts from the real one again - see cync-lan/README.md's history
# of that drift for why this exists. Opens a pull request rather than
# pushing directly to dev, so a human still reviews what changed before it
# lands (and so the Builder workflow's normal push-triggered build isn't
# bypassed).
#
# NOTE: creating that pull request requires "Allow GitHub Actions to create
# and approve pull requests" (Settings -> Actions -> General -> Workflow
# permissions). Without it the subtree pull and the branch push both succeed
# and only the final step fails, with
#
#     GitHub Actions is not permitted to create or approve pull requests
#
# which leaves the synced work stranded on the subtree-sync/cync-lan branch
# with nothing pointing at it. That is precisely how the run of 2026-07-27
# failed, and why the add-on stayed on 0.0.6b45 while upstream reached 0.2.2.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull the cync-lan python branch into cync-lan/upstream
        run: |
          git subtree pull --prefix=cync-lan/upstream \
            https://github.com/Proxy-alt/cync-lan.git python --squash \
            -m "Subtree-sync: pull cync-lan python branch"

      - name: Copy the canonical CHANGELOG.md over the add-on's own copy
        run: |
          if ! cmp -s cync-lan/upstream/CHANGELOG.md cync-lan/CHANGELOG.md; then
            cp cync-lan/upstream/CHANGELOG.md cync-lan/CHANGELOG.md
            git add cync-lan/CHANGELOG.md
            git commit -m "Sync cync-lan/CHANGELOG.md from upstream"
          fi

      # Home Assistant decides whether to offer users an update by comparing
      # this version field and nothing else. Syncing the code without bumping
      # it means a rebuilt add-on ships new code that no existing install is
      # ever prompted to take - which is exactly what happened here: the
      # subtree reached 0.2.2 while config.yaml sat at 0.0.6b45.
      - name: Bump the add-on version to match upstream
        run: |
          python3 - <<'PY'
          import re, sys, tomllib

          with open("cync-lan/upstream/pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          path = "cync-lan/config.yaml"
          src = open(path).read()

          # A targeted line rewrite, not a YAML round-trip: parsing and
          # re-dumping this file would silently discard its comments and
          # reorder its keys.
          new, count = re.subn(
              r'^(version:[ \t]*)"[^"]*"', rf'\g<1>"{version}"', src,
              count=1, flags=re.M,
          )
          if count != 1:
              sys.exit(f"expected exactly one version: line in {path}, found {count}")

          if new != src:
              open(path, "w").write(new)
              print(f"bumped to {version}")
          else:
              print(f"already at {version}")
          PY

          if ! git diff --quiet cync-lan/config.yaml; then
            git add cync-lan/config.yaml
            git commit -m "Bump add-on version to match upstream"
          fi

      - name: Open a pull request with anything that changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: subtree-sync/cync-lan
          delete-branch: true
          base: dev
          title: "Sync cync-lan subtree"
          body: |
            Automated pull from [Proxy-alt/cync-lan](https://github.com/Proxy-alt/cync-lan)'s
            `python` branch (`cync-lan/upstream/`), with `cync-lan/CHANGELOG.md`
            and the `version:` in `cync-lan/config.yaml` re-synced from it if
            they changed.

            **Check the version bump before merging.** It is what Home
            Assistant uses to offer the update to existing installs, so
            merging this is what makes the synced code actually reach anyone.

            `cync-lan/README.md`'s own device-support summary is **not**
            auto-updated by this workflow (its structure/audience differs
            from the upstream project's own README) - if `cync-lan/upstream/docs/known_devices.md`
            changed in this pull, check whether `cync-lan/README.md` needs a
            manual update to match.
          commit-message: "Subtree-sync: pull cync-lan python branch"
